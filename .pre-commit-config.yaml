repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^vendor/|(^|/)testdata/|\.patch$
      - id: end-of-file-fixer
        exclude: ^vendor/|(^|/)testdata/
      - id: check-yaml
        exclude: ^vendor/|(^|/)testdata/
      - id: check-json
        exclude: ^vendor/|(^|/)testdata/

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        exclude: ^vendor/|(^|/)testdata/|^internal/bindata/

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["-e", "SC1091,SC2086,SC2046"]
        files: \.(sh|bash)$
        # Pre-existing legacy scripts predate agentic-readiness tooling and carry
        # accumulated shellcheck debt out of scope for this change; only newly
        # added/modified scripts are enforced going forward.
        exclude: '^vendor/|(^|/)testdata/|^\.ci/|^UPSTREAM-MERGE\.sh$|^ci/tests/|^hack/check-olm\.sh$|^hack/generate/migrate-markers\.sh$|^hack/generate/olm_bindata\.sh$|^hack/lib/common\.sh$|^website/scripts/|^\.github/workflows/freshen-images/|^\.github/workflows/get_image_tags\.sh$'

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: ["--disable", "MD013", "MD033", "MD041", "--"]
        files: ^docs/.*\.md$
        exclude: ^vendor/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        exclude: ^vendor/|(^|/)testdata/
