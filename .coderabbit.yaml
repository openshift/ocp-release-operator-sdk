language: en-US
reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - "!testdata/**"
    - "!doc/**"
    - "!vendor/**"
    - "!go.sum"
    - "!internal/bindata/olm/**"
    - "!.cncf-maintainers"
    - "!website/**"
  path_instructions:
    - path: "patches/**"
      instructions: |
        Verify patch applies cleanly with `make -f ci/prow.Makefile patch`.
        Check that patch targets still exist in upstream source.
        Prefer minimal patches.
    - path: "release/helm/**"
      instructions: |
        Changes affect the shipped Helm Operator image.
        Builder and base image references must use registry.ci.openshift.org paths.
    - path: "hack/auto-rebase.sh"
      instructions: |
        This runs as a Prow periodic with elevated credentials.
        Ensure DRY_RUN=1 path is handled correctly.
        Error handling must be defensive for unattended execution.
    - path: "ci/**"
      instructions: |
        prow.Makefile changes affect downstream CI builds.
        Test scripts in ci/tests/ are CI entrypoints.
  tools:
    enabled: true
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    project_keys: []
  linear:
    team_keys: []
  pull_requests:
    scope: auto
  learnings_scope: auto
  issues_scope: auto
  pull_requests_scope: auto
  code_guidelines:
    - filePatterns:
        - "AGENTS.md"
